<text x="205.0" y="1611.0" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1E293B">Patient</text>
<text x="28.0" y="1789.0" font-size="13" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E293B">Notes</text>
<text x="28.0" y="1813.0" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#475569">• Admin Staff, Medical Manager, Doctor and Patient are specialisations of User, so they all inherit</text>
<text x="28.0" y="1833.0" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#475569">   Login, Logout, Edit Own Profile and View Home Dashboard.</text>
<text x="28.0" y="1853.0" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#475569">• «include»: the base use case always performs the included one.</text>
<text x="28.0" y="1873.0" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#475569">• «extend»: optional extra behaviour, e.g. checking a roster conflict while managing the roster.</text>
<text x="28.0" y="1893.0" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#475569">• Roles share data through the same .txt files: a Patient&#x27;s booking appears in the Doctor&#x27;s appointments,</text>
<text x="28.0" y="1913.0" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#475569">   and the Doctor&#x27;s prescriptions and clinical feedback appear in the Patient&#x27;s medical history.</text>
</svg>